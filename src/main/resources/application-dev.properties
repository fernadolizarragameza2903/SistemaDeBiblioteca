# Perfil de desarrollo: PostgreSQL local
# Credenciales por variables de entorno; los valores por defecto son solo para desarrollo local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_biblioteca}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo crea database/01_schema.sql; Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
