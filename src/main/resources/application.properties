spring.application.name=SistemaDeBiblioteca

# Perfil activo por defecto (dev | prod). Se puede cambiar con SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto: las plataformas cloud (Render) lo inyectan en la variable PORT
server.port=${PORT:8080}

# JPA comun a todos los perfiles
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Reglas de negocio de prestamos
app.prestamos.dias-maximos=14
app.prestamos.maximo-activos-por-usuario=3

# Actuator: solo se exponen salud e informacion (usados por Docker, CI y Render)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.nombre=Sistema de Biblioteca
info.app.version=@project.version@
# Render inyecta RENDER_GIT_COMMIT: el pipeline de CD lo usa para verificar que se desplego el commit correcto
info.app.commit=${RENDER_GIT_COMMIT:local}
