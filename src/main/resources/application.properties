spring.application.name=SistemaDeBiblioteca

# Perfil activo por defecto (dev | prod). Se puede cambiar con SPRING_PROFILES_ACTIVE
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA comun a todos los perfiles
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Reglas de negocio de prestamos
app.prestamos.dias-maximos=14
app.prestamos.maximo-activos-por-usuario=3
