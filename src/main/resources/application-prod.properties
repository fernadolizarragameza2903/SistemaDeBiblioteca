# Perfil de produccion: todas las credenciales son obligatorias por variables de entorno.
# DB_URL completa, o bien sus partes DB_HOST / DB_PORT / DB_NAME (asi las entrega Render).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# En produccion no se muestran detalles internos de la salud ni trazas de error
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
