<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Encabezado comun: metadatos, Bootstrap e iconos -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Sistema de Biblioteca'">Sistema de Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<!-- Barra de navegacion: 'activo' resalta la seccion actual -->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <i class="bi bi-book-half me-1"></i> Biblioteca
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}">
                        <i class="bi bi-speedometer2"></i> Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'libros'} ? 'active'" th:href="@{/libros}">
                        <i class="bi bi-journal-bookmark"></i> Libros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'categorias'} ? 'active'" th:href="@{/categorias}">
                        <i class="bi bi-tags"></i> Categorías</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active'" th:href="@{/usuarios}">
                        <i class="bi bi-people"></i> Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'prestamos'} ? 'active'" th:href="@{/prestamos}">
                        <i class="bi bi-arrow-left-right"></i> Préstamos</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Mensajes flash de exito o error enviados con RedirectAttributes -->
<div th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${exito}">Operacion exitosa</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}">Ocurrio un error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<!-- Pie de pagina -->
<footer th:fragment="footer" class="footer mt-auto py-3 bg-body-tertiary border-top">
    <div class="container d-flex justify-content-between small text-secondary">
        <span>Sistema de Biblioteca</span>
        <span>UTP · Herramientas de Desarrollo</span>
    </div>
</footer>

<!-- Scripts comunes -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
