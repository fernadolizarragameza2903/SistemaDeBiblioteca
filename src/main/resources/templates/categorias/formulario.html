<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${categoriaId} ? 'Editar categoría' : 'Nueva categoría')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h1 th:text="${categoriaId} ? 'Editar categoría' : 'Nueva categoría'">Nueva categoría</h1>
        <a class="btn btn-outline-secondary" th:href="@{/categorias}"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card">
        <div class="card-body">
            <form th:action="${categoriaId} ? @{/categorias/{id}(id=${categoriaId})} : @{/categorias}"
                  th:object="${categoria}" method="post" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción <span class="text-secondary">(opcional)</span></label>
                    <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}" maxlength="500"
                              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                    <a class="btn btn-light" th:href="@{/categorias}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
