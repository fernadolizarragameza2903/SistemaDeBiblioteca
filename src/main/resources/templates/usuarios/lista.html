<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h1><i class="bi bi-people me-1"></i> Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}"><i class="bi bi-person-plus"></i> Nuevo usuario</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card">
        <div class="table-responsive" th:unless="${#lists.isEmpty(usuarios)}">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td class="fw-semibold" th:text="${u.nombre + ' ' + u.apellido}">Nombre Apellido</td>
                    <td th:text="${u.email}">correo@ejemplo.com</td>
                    <td>
                        <span class="badge"
                              th:classappend="${u.nombreRol == 'ADMIN'} ? 'text-bg-dark' : (${u.nombreRol == 'BIBLIOTECARIO'} ? 'text-bg-primary' : 'text-bg-light border')"
                              th:text="${u.nombreRol}">ROL</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/prestamos/usuario/{id}(id=${u.id})}"
                           title="Historial de préstamos"><i class="bi bi-clock-history"></i></a>
                        <form class="d-inline" th:action="@{/usuarios/{id}/baja(id=${u.id})}" method="post"
                              onsubmit="return confirm('¿Dar de baja este usuario?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit" title="Dar de baja">
                                <i class="bi bi-person-x"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(usuarios)}">
            <i class="bi bi-people"></i> No hay usuarios activos
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
