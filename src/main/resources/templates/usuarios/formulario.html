<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>

<main class="container py-4">
    <div class="page-header">
        <h1>Nuevo usuario</h1>
        <a class="btn btn-outline-secondary" th:href="@{/usuarios}"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/usuarios}" th:object="${usuario}" method="post" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" id="apellido" class="form-control" th:field="*{apellido}"
                               th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{apellido}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" th:field="*{password}"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                        <div class="form-text">Mínimo 8 caracteres.</div>
                    </div>
                    <div class="col-md-3">
                        <label for="rolId" class="form-label">Rol</label>
                        <select id="rolId" class="form-select" th:field="*{rolId}"
                                th:classappend="${#fields.hasErrors('rolId')} ? 'is-invalid'">
                            <option value="">Seleccione…</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}">ROL</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{rolId}"></div>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                    <a class="btn btn-light" th:href="@{/usuarios}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
