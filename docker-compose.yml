# =====================================================================
# Entorno completo en contenedores: PostgreSQL 16 + aplicacion Spring Boot
#   1) cp .env.example .env      (y cambia las contrasenas)
#   2) docker compose up -d --build
#   3) http://localhost:8080      (salud: /actuator/health)
# Las credenciales se leen del archivo .env, que NO se sube al repositorio.
# Solo la base de datos:  docker compose up -d postgres
# =====================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioteca-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_biblioteca}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      # Los scripts de database/ crean el esquema y los datos de prueba en el primer arranque
      - ./database:/docker-entrypoint-initdb.d:ro
      - biblioteca-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_biblioteca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: sistema-biblioteca:local
    container_name: biblioteca-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sistema_biblioteca}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "8080:8080"

volumes:
  biblioteca-data:
